# Конфигурация анализатора угроз

# Пути к файлам (относительно папки скрипта)
files:
  log:    "suricata_events.jsonl"
  report: "./results/report.json"
  chart:  "./results/threats_chart.png"

# Пороги реагирования на аномалии для предупреждения и блокировки
thresholds:
  alert_threshold:  1    # аномалий с одного IP для предупреждения
  block_threshold:  2    # аномалий с одного IP для блокировки
  vt_malicious_min: 1    # минимум детектов VT для пометки как угрозы

# Настройки для работы VirusTotal API
virustotal:
  request_delay:  15     # секунд между запросами (бесплатный план: 4 req/min)
  retry_count:    3      # повторных попыток при SSL/сетевых ошибках
  retry_delay:    5      # секунд между повторными попытками

# Приватные сети, IP которых не отправляется на проверку в VirusTotal API
private_networks:
  - "192.168."
  - "10."
  - "172.16."
  - "172.17."
  - "172.18."
  - "172.19."
  - "172.20."
  - "172.21."
  - "172.22."
  - "172.23."
  - "172.24."
  - "172.25."
  - "172.26."
  - "172.27."
  - "172.28."
  - "172.29."
  - "172.30."
  - "172.31."
  - "127."
  - "0.0.0.0"

# Настройки для работы Vulners API
vulners:
  request_delay: 2      # секунд между запросами (бесплатный план)

# Настройки уведомлений в Telegram
telegram:
  enabled: true
  # Минимальный уровень для отправки: "block" | "alert" | "all"
  min_level: "alert"
  # Отправлять итоговую сводку после анализа
  send_summary: true
  # Отправлять график как фото
  send_chart: true